<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ear Training Card Preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Nunito, sans-serif;
  background: #eee;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

body.dark-body { background: #1a1d22; }

h2 { font-size: 14px; color: #999; margin-bottom: 4px; }

.card-frame {
  background: #FFFAF0;
  border-radius: 12px;
  padding: 20px;
  max-width: 520px;
  width: 100%;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  --text-primary: #333;
  --text-secondary: rgba(0,0,0,0.45);
  --bg-subtle: rgba(0,0,0,0.06);
  --bg-chip: rgba(0,0,0,0.12);
  --accent: #4ba9c8;
  --green: #3a9a5a;
  --red: #c75050;
}

.card-frame.dark {
  background: #333b45;
  --text-primary: #e6e6e6;
  --text-secondary: rgba(255,255,255,0.45);
  --bg-subtle: rgba(255,255,255,0.08);
  --bg-chip: rgba(255,255,255,0.15);
  --accent: #4ba9c8;
  --green: #5db87a;
  --red: #c75a5a;
}

.tag {
  color: var(--text-secondary);
  font-size: 16px;
  background-color: var(--bg-subtle);
  padding: 2px 8px;
  border-radius: 5px;
  display: table;
  margin-bottom: 12px;
}

.fretboard-prompt {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.fretboard-name {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 10px;
}

.answer-section {
  padding: 14px 16px;
  background: var(--bg-subtle);
  border-radius: 10px;
  margin-top: 14px;
  text-align: center;
  cursor: pointer;
  transition: background 0.2s ease;
}

.answer-section:hover { filter: brightness(1.1); }

@keyframes keyPulse {
  0% { transform: scale(0.8); opacity: 0; }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); opacity: 1; }
}

.note-reveal {
  font-size: 56px;
  font-weight: 800;
  color: #fff;
  animation: keyPulse 0.5s ease-out;
}

.note-label {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 8px;
}

.note-detail-colored {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
}

.tap-hint {
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  margin-top: 6px;
}

.replay-btn {
  display: inline-block;
  font-size: 13px;
  cursor: pointer;
  opacity: 0.4;
  transition: opacity 0.2s;
  user-select: none;
  margin-top: 8px;
  padding: 4px 12px;
  background: var(--bg-subtle);
  border-radius: 6px;
  color: var(--text-secondary);
}
.replay-btn:hover { opacity: 0.7; }

.interval-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
  justify-content: center;
}

.interval-btn {
  font-family: Nunito, sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  min-height: 36px;
  background: var(--bg-subtle);
  color: var(--text-primary);
  transition: all 0.15s ease;
  touch-action: manipulation;
}

.interval-btn:hover { filter: brightness(0.9); }
.interval-btn:active { opacity: 0.6; }

.interval-btn.correct {
  background: var(--green) !important;
  color: #fff !important;
}

.interval-btn.wrong {
  background: var(--red) !important;
  color: #fff !important;
}

.controls {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.controls label { font-size: 13px; color: #666; }
.controls select, .controls button {
  font-family: Nunito; font-size: 13px; padding: 4px 10px; border-radius: 6px;
  border: 1px solid #ccc; background: #fff; cursor: pointer;
}
.controls button { background: #4ba9c8; color: #fff; border: none; }

.ghost-group { opacity: 0; pointer-events: none; transition: opacity 0.1s; }
.tap-zone:hover + .ghost-group { opacity: 0.25; }
.tap-zone { cursor: pointer; }
</style>
</head>
<body>

<div class="controls">
  <button onclick="randomCard()">Random</button>
  <button onclick="toggleDark()">Dark Mode</button>
  <label><input type="checkbox" id="show-back" onchange="render()"> Show Back</label>
  <label>Card: <select id="sel-card"></select></label>
</div>

<h2>Front</h2>
<div class="card-frame" id="card-front"></div>

<div id="back-wrapper" style="display:none;">
<h2>Back</h2>
<div class="card-frame" id="card-back"></div>
</div>

<script>
// ─── Data ───
var tuning = [64, 59, 55, 50, 45, 40];
var noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var stringLabels = ['E','B','G','D','A','E'];

var noteColors = {
  'C':'#DC4040','C#':'#6A1FCC','D':'#E8C820','D#':'#9898A0',
  'E':'#6AADBD','F':'#9B1B1B','F#':'#7B2DB8','G':'#E08030',
  'G#':'#B85EB0','A':'#2E8B57','A#':'#A85A30','B':'#4169E1'
};

var intervalFullNames = {
  'P1':'Unison','m2':'Minor 2nd','M2':'Major 2nd','m3':'Minor 3rd','M3':'Major 3rd',
  'P4':'Perfect 4th','TT':'Tritone','P5':'Perfect 5th','m6':'Minor 6th','M6':'Major 6th',
  'm7':'Minor 7th','M7':'Major 7th','P8':'Octave'
};

var intervalList = ['P1','m2','M2','m3','M3','P4','TT','P5','m6','M6','m7','M7','P8'];

var intervalColors = {
  'P1':'#4ba9c8','m2':'#9B1B1B','M2':'#7a8a96','m3':'#c87a30','M3':'#e8a030',
  'P4':'#5a8abf','TT':'#9b59b6','P5':'#3a9a5a','m6':'#6A1FCC','M6':'#2E8B57',
  'm7':'#c75050','M7':'#9b59b6','P8':'#4ba9c8'
};

var isDark = false;
var answered = false;
var currentCard = null;

// ─── Card data (embedded) ───
var cards = [];
var cardData = [
  ['E',6,0,6,0,'P1','E2','E2'],['E',6,0,6,1,'m2','E2','F2'],['E',6,0,6,2,'M2','E2','F#2'],
  ['E',6,0,6,3,'m3','E2','G2'],['E',6,0,6,4,'M3','E2','G#2'],['E',6,0,6,5,'P4','E2','A2'],
  ['E',6,0,6,6,'TT','E2','A#2'],['E',6,0,6,7,'P5','E2','B2'],['E',6,0,6,8,'m6','E2','C3'],
  ['E',6,0,6,9,'M6','E2','C#3'],['E',6,0,6,10,'m7','E2','D3'],['E',6,0,6,11,'M7','E2','D#3'],
  ['E',6,0,6,12,'P8','E2','E3'],
  ['A',5,0,5,0,'P1','A2','A2'],['A',5,0,5,1,'m2','A2','A#2'],['A',5,0,5,2,'M2','A2','B2'],
  ['A',5,0,5,3,'m3','A2','C3'],['A',5,0,5,4,'M3','A2','C#3'],['A',5,0,5,5,'P4','A2','D3'],
  ['A',5,0,5,6,'TT','A2','D#3'],['A',5,0,5,7,'P5','A2','E3'],['A',5,0,5,8,'m6','A2','F3'],
  ['A',5,0,5,9,'M6','A2','F#3'],['A',5,0,5,10,'m7','A2','G3'],['A',5,0,5,11,'M7','A2','G#3'],
  ['A',5,0,5,12,'P8','A2','A3'],
  ['D',4,0,4,0,'P1','D3','D3'],['D',4,0,4,1,'m2','D3','D#3'],['D',4,0,4,2,'M2','D3','E3'],
  ['D',4,0,4,3,'m3','D3','F3'],['D',4,0,4,4,'M3','D3','F#3'],['D',4,0,4,5,'P4','D3','G3'],
  ['D',4,0,4,6,'TT','D3','G#3'],['D',4,0,4,7,'P5','D3','A3'],['D',4,0,4,8,'m6','D3','A#3'],
  ['D',4,0,4,9,'M6','D3','B3'],['D',4,0,4,10,'m7','D3','C4'],['D',4,0,4,11,'M7','D3','C#4'],
  ['D',4,0,4,12,'P8','D3','D4'],
  ['G',3,0,3,0,'P1','G3','G3'],['G',3,0,3,1,'m2','G3','G#3'],['G',3,0,3,2,'M2','G3','A3'],
  ['G',3,0,3,3,'m3','G3','A#3'],['G',3,0,3,4,'M3','G3','B3'],['G',3,0,3,5,'P4','G3','C4'],
  ['G',3,0,3,6,'TT','G3','C#4'],['G',3,0,3,7,'P5','G3','D4'],['G',3,0,3,8,'m6','G3','D#4'],
  ['G',3,0,3,9,'M6','G3','E4'],['G',3,0,3,10,'m7','G3','F4'],['G',3,0,3,11,'M7','G3','F#4'],
  ['G',3,0,3,12,'P8','G3','G4']
];

cardData.forEach(function(d) {
  cards.push({
    rootName: d[0], rootStr: d[1], rootFret: d[2],
    tgtStr: d[3], tgtFret: d[4], interval: d[5],
    refNote: d[6], tgtNote: d[7],
    name: d[5] + ' from ' + d[0]
  });
});

// Populate selector
var sel = document.getElementById('sel-card');
cards.forEach(function(c, i) {
  var o = document.createElement('option');
  o.value = i;
  o.textContent = c.name + ' (' + c.refNote + ' -> ' + c.tgtNote + ')';
  sel.appendChild(o);
});
sel.onchange = function() { loadCard(parseInt(sel.value)); };

// ─── Audio ───
function noteFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

function midiFromNoteStr(noteStr) {
  // Parse "E2", "C#3", etc.
  var match = noteStr.match(/^([A-G]#?)(\d+)$/);
  if (!match) return 60;
  var name = match[1];
  var oct = parseInt(match[2]);
  var idx = noteNames.indexOf(name);
  return (oct + 1) * 12 + idx;
}

function playGuitarNote(midi, startTime) {
  try {
    var ctx = window._audioCtx || (window._audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    var freq = noteFreq(midi);
    var now = startTime || ctx.currentTime;

    // Main oscillator with slight detune
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.3, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    g.connect(ctx.destination);
    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    osc.connect(g);
    osc.start(now);
    osc.stop(now + 1.5);

    // Detune oscillator for guitar-like timbre
    var g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.08, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    g2.connect(ctx.destination);
    var osc2 = ctx.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2.002, now);
    osc2.connect(g2);
    osc2.start(now);
    osc2.stop(now + 1.0);
  } catch(e) {}
}

function playInterval(refMidi, tgtMidi) {
  var ctx = window._audioCtx || (window._audioCtx = new (window.AudioContext || window.webkitAudioContext)());
  if (ctx.state === 'suspended') ctx.resume();
  var now = ctx.currentTime;
  playGuitarNote(refMidi, now);
  playGuitarNote(tgtMidi, now + 0.8);
}

function playTap(string, fret) {
  var midi = tuning[string - 1] + fret;
  playGuitarNote(midi);
}

// ─── Fretboard renderer ───
function needsDarkText(hex) {
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 160;
}

function renderFretboard(opts) {
  opts = opts || {};
  var refDot = opts.refDot || null;
  var tgtDot = opts.tgtDot || null;
  var showTarget = opts.showTarget || false;
  var refLabel = opts.refLabel || null;
  var tgtLabel = opts.tgtLabel || null;
  var tgtColor = opts.tgtColor || 'var(--accent)';

  var numStrings = 6, numFrets = 12;
  var w = 540, h = 150;
  var labelW = 24, nutX = labelW + 24, nutW = 4;
  var fretStart = nutX + nutW + 2;
  var fretW = (w - fretStart) / numFrets;
  var stringGap = h / (numStrings + 1);

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;max-width:540px;">';

  // Nut
  svg += '<rect x="' + nutX + '" y="' + (stringGap * 0.7) + '" width="' + nutW + '" height="' + (stringGap * numStrings - stringGap * 0.4) + '" fill="var(--text-primary)" rx="1" opacity="0.6"/>';

  // Fret wires
  for (var f = 1; f <= numFrets; f++) {
    var x = fretStart + fretW * f;
    svg += '<line x1="' + x + '" y1="' + (stringGap * 0.7) + '" x2="' + x + '" y2="' + (stringGap * numStrings + stringGap * 0.3) + '" stroke="var(--text-secondary)" stroke-width="1" opacity="0.3"/>';
  }

  // Fret numbers
  for (var f = 1; f <= numFrets; f++) {
    var x = fretStart + fretW * (f - 0.5);
    svg += '<text x="' + x + '" y="' + (h - 2) + '" text-anchor="middle" font-size="8" fill="var(--text-secondary)" font-family="Nunito,sans-serif" opacity="0.5">' + f + '</text>';
  }

  // Dot markers (3,5,7,9,12)
  var markers = [3, 5, 7, 9];
  var midY = (stringGap * 3 + stringGap * 4) / 2;
  markers.forEach(function(d) {
    var x = fretStart + fretW * (d - 0.5);
    svg += '<circle cx="' + x + '" cy="' + midY + '" r="3.5" fill="var(--text-secondary)" opacity="0.15"/>';
  });
  var x12 = fretStart + fretW * 11.5;
  svg += '<circle cx="' + x12 + '" cy="' + (midY - 10) + '" r="3.5" fill="var(--text-secondary)" opacity="0.15"/>';
  svg += '<circle cx="' + x12 + '" cy="' + (midY + 10) + '" r="3.5" fill="var(--text-secondary)" opacity="0.15"/>';

  // Strings
  for (var s = 1; s <= numStrings; s++) {
    var y = stringGap * s;
    var thickness = 0.6 + (s * 0.25);
    svg += '<line x1="' + nutX + '" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="var(--text-primary)" stroke-width="' + thickness + '" opacity="0.3"/>';
  }

  // String labels
  for (var s = 1; s <= numStrings; s++) {
    var y = stringGap * s;
    svg += '<text x="' + (labelW * 0.5) + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="10" fill="var(--text-secondary)" font-family="Nunito,sans-serif" opacity="0.5">' + stringLabels[s-1] + '</text>';
  }

  // Helper to compute dot cx
  function dotCx(fret) {
    return fret === 0 ? (labelW + nutX) / 2 + 14 : fretStart + fretW * (fret - 0.5);
  }

  // Reference dot (always shown)
  if (refDot) {
    var rcy = stringGap * refDot.s;
    var rcx = dotCx(refDot.f);
    svg += '<circle cx="' + rcx + '" cy="' + rcy + '" r="10" fill="var(--accent)"/>';
    // White ring outline for root
    svg += '<circle cx="' + rcx + '" cy="' + rcy + '" r="14" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>';

    if (!showTarget) {
      // Pulsing ring
      svg += '<circle cx="' + rcx + '" cy="' + rcy + '" r="10" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.4">';
      svg += '<animate attributeName="r" from="10" to="20" dur="2s" repeatCount="indefinite"/>';
      svg += '<animate attributeName="opacity" from="0.4" to="0" dur="2s" repeatCount="indefinite"/>';
      svg += '</circle>';
    }

    if (showTarget && refLabel) {
      svg += '<text x="' + rcx + '" y="' + (rcy + 4) + '" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + refLabel + '</text>';
    }
  }

  // Target dot (shown on back / after answer)
  if (showTarget && tgtDot) {
    var tcy = stringGap * tgtDot.s;
    var tcx = dotCx(tgtDot.f);

    // Don't overlap if same position as ref (P1/unison)
    if (refDot && refDot.s === tgtDot.s && refDot.f === tgtDot.f) {
      // Just add label to existing dot
      svg += '<text x="' + tcx + '" y="' + (tcy + 4) + '" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + (tgtLabel || '') + '</text>';
    } else {
      svg += '<circle cx="' + tcx + '" cy="' + tcy + '" r="10" fill="' + tgtColor + '"/>';
      if (tgtLabel) {
        svg += '<text x="' + tcx + '" y="' + (tcy + 4) + '" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + tgtLabel + '</text>';
      }
    }
  }

  // Tap zones
  for (var s = 1; s <= numStrings; s++) {
    for (var f = 0; f <= numFrets; f++) {
      var cy = stringGap * s;
      var cx = dotCx(f);
      svg += '<circle class="tap-zone" cx="' + cx + '" cy="' + cy + '" r="' + (fretW * 0.4) + '" fill="transparent" data-s="' + s + '" data-f="' + f + '"/>';
      svg += '<g class="ghost-group"><circle cx="' + cx + '" cy="' + cy + '" r="6" fill="var(--accent)"/></g>';
    }
  }

  svg += '</svg>';
  return svg;
}

function attachTapHandlers(container) {
  container.querySelectorAll('.tap-zone').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      playTap(parseInt(el.getAttribute('data-s')), parseInt(el.getAttribute('data-f')));
    });
  });
}

// ─── Card rendering ───
function loadCard(idx) {
  currentCard = cards[idx];
  answered = false;
  document.getElementById('sel-card').value = idx;
  render();
  // Auto-play
  var refMidi = midiFromNoteStr(currentCard.refNote);
  var tgtMidi = midiFromNoteStr(currentCard.tgtNote);
  setTimeout(function() { playInterval(refMidi, tgtMidi); }, 300);
}

function render() {
  if (!currentCard) return;
  var c = currentCard;
  var showBack = document.getElementById('show-back').checked;

  var front = document.getElementById('card-front');
  var backWrapper = document.getElementById('back-wrapper');
  var back = document.getElementById('card-back');

  var refDot = { s: c.rootStr, f: c.rootFret };
  var tgtDot = { s: c.tgtStr, f: c.tgtFret };
  var refNoteName = c.refNote.replace(/\d+$/, '');
  var tgtNoteName = c.tgtNote.replace(/\d+$/, '');

  // Front
  var frontHtml = '<div class="tag">Ear Training</div>'
    + '<div class="fretboard-prompt">What interval is this?</div>'
    + renderFretboard({ refDot: refDot })
    + '<div class="replay-btn" id="replay-front">Replay</div>';

  // Interval buttons
  if (!answered) {
    frontHtml += '<div class="interval-buttons" id="iv-btns">';
    intervalList.forEach(function(iv) {
      frontHtml += '<button class="interval-btn" data-iv="' + iv + '">' + iv + '</button>';
    });
    frontHtml += '</div>';
  } else {
    frontHtml += '<div class="interval-buttons" id="iv-btns">';
    intervalList.forEach(function(iv) {
      var cls = 'interval-btn';
      if (iv === c.interval) cls += ' correct';
      else if (iv === answered && iv !== c.interval) cls += ' wrong';
      frontHtml += '<button class="' + cls + '" data-iv="' + iv + '">' + iv + '</button>';
    });
    frontHtml += '</div>';

    // Show result text
    var isCorrect = answered === c.interval;
    frontHtml += '<div style="margin-top:10px;font-size:14px;font-weight:700;color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + ';">'
      + (isCorrect ? 'Correct!' : 'Wrong - it was ' + c.interval + ' (' + intervalFullNames[c.interval] + ')')
      + '</div>';
  }

  front.innerHTML = frontHtml;

  // Replay handler
  document.getElementById('replay-front').onclick = function() {
    var refMidi = midiFromNoteStr(c.refNote);
    var tgtMidi = midiFromNoteStr(c.tgtNote);
    playInterval(refMidi, tgtMidi);
  };

  // Button handlers
  document.querySelectorAll('#iv-btns .interval-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (answered) return;
      answered = btn.getAttribute('data-iv');
      render();
    });
  });

  attachTapHandlers(front);

  // Back
  if (showBack || answered) {
    backWrapper.style.display = '';
    var ivColor = intervalColors[c.interval] || 'var(--accent)';
    var dark = needsDarkText(ivColor);
    var textCol = dark ? 'rgba(0,0,0,0.7)' : '#fff';
    var subCol = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.5)';
    var hintCol = dark ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.35)';

    back.innerHTML = '<div class="tag">Ear Training</div>'
      + '<div class="fretboard-prompt">What interval is this?</div>'
      + renderFretboard({
          refDot: refDot, tgtDot: tgtDot, showTarget: true,
          refLabel: refNoteName, tgtLabel: tgtNoteName, tgtColor: ivColor
        })
      + '<div class="answer-section" id="answer-area" style="background:' + ivColor + ';padding:24px;">'
      + '<div class="note-label" style="color:' + subCol + ';">Interval</div>'
      + '<div class="note-reveal" style="color:' + textCol + ';">' + c.interval + '</div>'
      + '<div class="note-detail-colored" style="color:' + subCol + ';">' + intervalFullNames[c.interval] + '</div>'
      + '<div class="note-detail-colored" style="color:' + subCol + ';margin-top:4px;">' + refNoteName + ' &rarr; ' + tgtNoteName + '</div>'
      + '<div class="tap-hint" style="color:' + hintCol + ';">tap to replay</div>'
      + '</div>';

    document.getElementById('answer-area').onclick = function() {
      var refMidi = midiFromNoteStr(c.refNote);
      var tgtMidi = midiFromNoteStr(c.tgtNote);
      playInterval(refMidi, tgtMidi);
    };
    attachTapHandlers(back);
  } else {
    backWrapper.style.display = 'none';
  }

  applyDark();
}

function randomCard() {
  var idx = Math.floor(Math.random() * cards.length);
  loadCard(idx);
}

function toggleDark() {
  isDark = !isDark;
  document.body.classList.toggle('dark-body', isDark);
  applyDark();
}

function applyDark() {
  document.querySelectorAll('.card-frame').forEach(function(el) {
    el.classList.toggle('dark', isDark);
  });
}

// Init
loadCard(0);
</script>
</body>
</html>
