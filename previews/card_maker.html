<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Card Maker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Nunito, sans-serif;
  background: #eee;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
body.dark-body { background: #1a1d22; color: #e6e6e6; }

h1 { font-size: 22px; font-weight: 800; color: #333; }
body.dark-body h1 { color: #e6e6e6; }

.status-bar {
  display: flex; align-items: center; gap: 10px;
  background: #fff; border-radius: 10px; padding: 10px 16px;
  max-width: 560px; width: 100%;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  font-size: 13px;
}
body.dark-body .status-bar { background: #2a2f38; }

.status-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #c75050; flex-shrink: 0;
}
.status-dot.connected { background: #3a9a5a; }
.status-text { flex: 1; color: #999; }
body.dark-body .status-text { color: #999; }

.btn {
  padding: 6px 14px; border: none; border-radius: 8px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: Nunito; transition: all 0.15s;
}
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-accent { background: #4ba9c8; color: #fff; }
.btn-accent:hover { background: #3a8fb0; }
.btn-green { background: #3a9a5a; color: #fff; }
.btn-green:hover { background: #2e8049; }
.btn-subtle { background: rgba(0,0,0,0.06); color: #666; }
.btn-subtle:hover { background: rgba(0,0,0,0.12); }
body.dark-body .btn-subtle { background: rgba(255,255,255,0.08); color: #aaa; }
.btn-red { background: #c75050; color: #fff; }
.btn-red:hover { background: #b04040; }

.card-frame {
  background: #FFFAF0;
  border-radius: 12px;
  padding: 20px;
  max-width: 560px;
  width: 100%;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  --text-primary: #333;
  --text-secondary: rgba(0,0,0,0.45);
  --bg-subtle: rgba(0,0,0,0.06);
  --bg-chip: rgba(0,0,0,0.12);
  --accent: #4ba9c8;
  --green: #3a9a5a;
  --red: #c75050;
  --border-dashed: rgba(0,0,0,0.12);
}
body.dark-body .card-frame {
  background: #333b45;
  --text-primary: #e6e6e6;
  --text-secondary: rgba(255,255,255,0.45);
  --bg-subtle: rgba(255,255,255,0.08);
  --bg-chip: rgba(255,255,255,0.15);
  --border-dashed: rgba(255,255,255,0.15);
}

.section-label {
  font-size: 11px; font-weight: 600; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 8px;
}

/* Form */
.form-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-bottom: 16px;
}
.form-group { display: flex; flex-direction: column; gap: 3px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
.form-input, .form-select {
  padding: 8px 12px; border: 1px solid var(--border-dashed);
  border-radius: 8px; font-size: 14px; font-family: Nunito;
  background: var(--bg-subtle); color: var(--text-primary);
  outline: none; transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus { border-color: #4ba9c8; }

/* Fretboard */
.fretboard-container { margin-bottom: 16px; }
.tap-zone { cursor: pointer; }
.tap-zone:hover + .ghost-group { opacity: 0.25; }
.ghost-group { opacity: 0; pointer-events: none; transition: opacity 0.1s; }

/* Dot list */
.dot-list {
  display: flex; flex-wrap: wrap; gap: 6px;
  min-height: 36px; padding: 8px;
  background: var(--bg-subtle); border-radius: 8px;
  margin-bottom: 12px; align-items: center;
}
.dot-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 600;
  background: var(--bg-chip); color: var(--text-primary);
  cursor: pointer; transition: all 0.15s; user-select: none;
}
.dot-chip:hover { opacity: 0.7; }
.dot-chip.is-root {
  background: #4ba9c8; color: #fff;
  box-shadow: 0 0 0 2px rgba(75,169,200,0.3);
}
.dot-chip .chip-num {
  font-size: 9px; opacity: 0.5;
  background: var(--bg-subtle); width: 16px; height: 16px;
  border-radius: 50%; display: inline-flex;
  align-items: center; justify-content: center;
}
.dot-chip .chip-x {
  font-size: 10px; opacity: 0.4; margin-left: 2px; cursor: pointer;
}
.dot-chip .chip-x:hover { opacity: 1; color: #c75050; }
.dot-placeholder { font-size: 12px; color: var(--text-secondary); opacity: 0.5; }

/* Computed fields */
.computed-row {
  display: flex; gap: 8px; margin-bottom: 8px;
  font-size: 12px; align-items: baseline;
}
.computed-label { font-weight: 600; color: var(--text-secondary); min-width: 65px; }
.computed-value {
  flex: 1; padding: 4px 8px; border-radius: 4px;
  background: var(--bg-subtle); color: var(--text-primary);
  font-family: monospace; font-size: 11px; word-break: break-all;
}

/* Preview */
.preview-toggle {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.preview-tab {
  padding: 5px 12px; border-radius: 6px; font-size: 12px;
  font-weight: 600; cursor: pointer; border: none;
  font-family: Nunito; transition: all 0.15s;
  background: var(--bg-subtle); color: var(--text-secondary);
}
.preview-tab.active { background: #4ba9c8; color: #fff; }

/* Controls bar */
.controls {
  display: flex; gap: 8px; flex-wrap: wrap;
  max-width: 560px; width: 100%;
}

/* Toast */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600;
  color: #fff; z-index: 1000; opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.success { background: #3a9a5a; }
.toast.error { background: #c75050; }

/* Deck selector */
.deck-selector {
  display: flex; gap: 8px; align-items: center;
  margin-bottom: 12px;
}
.deck-selector select {
  flex: 1; padding: 8px 12px; border: 1px solid var(--border-dashed);
  border-radius: 8px; font-size: 14px; font-family: Nunito;
  background: var(--bg-subtle); color: var(--text-primary); outline: none;
}
</style>
</head>
<body>

<h1>Guitar Card Maker</h1>

<div class="controls">
  <button class="btn btn-subtle" onclick="toggleDark()">Dark Mode</button>
  <button class="btn btn-red" onclick="clearAll()">Clear All</button>
</div>

<div class="status-bar">
  <div class="status-dot" id="status-dot"></div>
  <span class="status-text" id="status-text">Checking AnkiConnect...</span>
  <button class="btn btn-sm btn-accent" onclick="checkAnki()">Reconnect</button>
</div>

<!-- Metadata -->
<div class="card-frame">
  <div class="section-label">Card Details</div>
  <div class="form-grid">
    <div class="form-group">
      <span class="form-label">Type</span>
      <select class="form-select" id="card-type" onchange="onTypeChange()">
        <option value="chord">Chord</option>
        <option value="scale">Scale</option>
        <option value="arpeggio">Arpeggio</option>
        <option value="note">Single Note</option>
      </select>
    </div>
    <div class="form-group">
      <span class="form-label">Name</span>
      <input class="form-input" id="card-name" placeholder="e.g. Am pentatonic Pos 1">
    </div>
    <div class="form-group">
      <span class="form-label">Card Sides</span>
      <select class="form-select" id="card-sides">
        <option value="both">Both (Recognition + Recall)</option>
        <option value="recognition">Recognition only (see dots, name it)</option>
        <option value="recall">Recall only (see name, place dots)</option>
      </select>
    </div>
    <div class="form-group">
      <span class="form-label">Key</span>
      <input class="form-input" id="card-key" placeholder="e.g. Am, C, G">
    </div>
    <div class="form-group">
      <span class="form-label">Shape</span>
      <input class="form-input" id="card-shape" placeholder="e.g. Position 1, CAGED E">
    </div>
  </div>

  <!-- Fretboard -->
  <div class="section-label">Tap to place dots (click dot chip to set root)</div>
  <div class="fretboard-container" id="fretboard"></div>

  <!-- Dot list -->
  <div class="dot-list" id="dot-list">
    <span class="dot-placeholder">No dots placed yet</span>
  </div>

  <!-- Computed -->
  <div class="computed-row">
    <span class="computed-label">Dots</span>
    <span class="computed-value" id="comp-dots">-</span>
  </div>
  <div class="computed-row">
    <span class="computed-label">Notes</span>
    <span class="computed-value" id="comp-notes">-</span>
  </div>
  <div class="computed-row">
    <span class="computed-label">Intervals</span>
    <span class="computed-value" id="comp-intervals">-</span>
  </div>
</div>

<!-- Preview -->
<div class="card-frame">
  <div class="section-label">Preview</div>
  <div class="preview-toggle">
    <button class="preview-tab active" onclick="setPreview('recognition',this)">Recognition</button>
    <button class="preview-tab" onclick="setPreview('recall',this)">Recall</button>
  </div>
  <div id="preview-sides-note" style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;"></div>
  <div id="preview-area"></div>
</div>

<!-- Send -->
<div class="card-frame">
  <div class="section-label">Send to Anki</div>
  <div class="deck-selector">
    <select id="deck-select"><option value="">Loading decks...</option></select>
    <button class="btn btn-sm btn-subtle" onclick="loadDecks()">Refresh</button>
  </div>
  <button class="btn btn-green" style="width:100%;padding:12px;font-size:15px;" onclick="sendToAnki()">
    Send Card to Anki
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── State ───
var placedDots = []; // [{s, f}]
var rootIdx = 0;
var previewMode = 'recognition';
var ankiConnected = false;
var isDark = false;

// ─── Constants ───
var CHROMATIC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var STRING_OPEN = {1:'E',2:'B',3:'G',4:'D',5:'A',6:'E'};
var stringNames = ['E','B','G','D','A','E'];
var tuningMidi = [64, 59, 55, 50, 45, 40]; // strings 1-6

var SEMITONE_TO_INTERVAL = {
  0:'1',1:'b2',2:'2',3:'b3',4:'3',5:'4',
  6:'b5',7:'5',8:'b6',9:'6',10:'b7',11:'7'
};

var noteColors = {
  'C':'#DC4040','C#':'#6A1FCC','D':'#E8C820','D#':'#9898A0',
  'E':'#6AADBD','F':'#9B1B1B','F#':'#7B2DB8','G':'#E08030',
  'G#':'#B85EB0','A':'#2E8B57','A#':'#A85A30','B':'#4169E1'
};

var intervalColors = {
  '1':'#4ba9c8','R':'#4ba9c8','3':'#e8a030','b3':'#c87a30',
  '5':'#3a9a5a','b5':'#9b59b6','b7':'#c75050','7':'#9b59b6',
  '2':'#7a8a96','4':'#5a8abf','6':'#2E8B57','b6':'#6A1FCC',
  'b2':'#7a8a96'
};

function noteAt(s, f) {
  var base = CHROMATIC.indexOf(STRING_OPEN[s]);
  return CHROMATIC[(base + f) % 12];
}

function intervalFromRoot(rootNote, note) {
  var ri = CHROMATIC.indexOf(rootNote);
  var ni = CHROMATIC.indexOf(note);
  var semi = (ni - ri + 12) % 12;
  return SEMITONE_TO_INTERVAL[semi];
}

function needsDarkText(hex) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 160;
}

function getIntervalColor(interval) {
  return intervalColors[interval] || '#4ba9c8';
}

// ─── Audio ───
var audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playNote(s, f) {
  try {
    var ctx = ensureAudio();
    var midi = tuningMidi[s - 1] + f;
    var freq = 440 * Math.pow(2, (midi - 69) / 12);
    var now = ctx.currentTime;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    g.connect(ctx.destination);
    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    osc.connect(g);
    osc.start(now);
    osc.stop(now + 1.0);
  } catch(e) {}
}

// ─── Fretboard Renderer ───
function renderFretboard(opts) {
  opts = opts || {};
  var dots = opts.dots || [];
  var root = opts.root || null;
  var intervals = opts.intervals || null;
  var labels = opts.labels || null;
  var showLabels = opts.showLabels || false;
  var interactive = opts.interactive || false;
  var showNumbers = opts.showNumbers || false;

  var numStrings = 6, numFrets = 12;
  var w = 540, h = 150;
  var labelW = 24, nutX = labelW + 24, nutW = 4;
  var fretStart = nutX + nutW + 2;
  var fretW = (w - fretStart) / numFrets;
  var stringGap = h / (numStrings + 1);

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;max-width:540px;">';

  // Nut
  svg += '<rect x="' + nutX + '" y="' + (stringGap * 0.7) + '" width="' + nutW + '" height="' + (stringGap * numStrings - stringGap * 0.4) + '" fill="var(--text-primary)" rx="1" opacity="0.6"/>';

  // Fret wires
  for (var f = 1; f <= numFrets; f++) {
    var x = fretStart + fretW * f;
    svg += '<line x1="' + x + '" y1="' + (stringGap * 0.7) + '" x2="' + x + '" y2="' + (stringGap * numStrings + stringGap * 0.3) + '" stroke="var(--text-secondary)" stroke-width="1" opacity="0.3"/>';
  }

  // Fret numbers
  for (var f = 1; f <= numFrets; f++) {
    var x = fretStart + fretW * (f - 0.5);
    svg += '<text x="' + x + '" y="' + (h - 2) + '" text-anchor="middle" font-size="8" fill="var(--text-secondary)" font-family="Nunito,sans-serif" opacity="0.5">' + f + '</text>';
  }

  // Dot markers
  var markers = [3, 5, 7, 9];
  var midY = (stringGap * 3 + stringGap * 4) / 2;
  markers.forEach(function(d) {
    var x = fretStart + fretW * (d - 0.5);
    svg += '<circle cx="' + x + '" cy="' + midY + '" r="3.5" fill="var(--text-secondary)" opacity="0.15"/>';
  });
  var x12 = fretStart + fretW * 11.5;
  svg += '<circle cx="' + x12 + '" cy="' + (midY - 10) + '" r="3.5" fill="var(--text-secondary)" opacity="0.15"/>';
  svg += '<circle cx="' + x12 + '" cy="' + (midY + 10) + '" r="3.5" fill="var(--text-secondary)" opacity="0.15"/>';

  // Strings
  for (var s = 1; s <= numStrings; s++) {
    var y = stringGap * s;
    var thickness = 0.6 + (s * 0.25);
    svg += '<line x1="' + nutX + '" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="var(--text-primary)" stroke-width="' + thickness + '" opacity="0.3"/>';
  }

  // String labels
  for (var s = 1; s <= numStrings; s++) {
    var y = stringGap * s;
    svg += '<text x="' + (labelW * 0.5) + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="10" fill="var(--text-secondary)" font-family="Nunito,sans-serif" opacity="0.5">' + stringNames[s-1] + '</text>';
  }

  // Dots
  dots.forEach(function(d, i) {
    var cy = stringGap * d.s;
    var cx = d.f === 0 ? (labelW + nutX) / 2 + 14 : fretStart + fretW * (d.f - 0.5);
    var isRoot = root && root.s === d.s && root.f === d.f;
    var hasIntervals = intervals && intervals[i];
    var noteName = noteAt(d.s, d.f);
    var dotColor = noteColors[noteName] || 'var(--accent)';
    var r = 10;

    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + dotColor + '"/>';
    if (isRoot) {
      svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r + 4) + '" fill="none" stroke="' + dotColor + '" stroke-width="1.5" opacity="0.5"/>';
    }

    // Label
    if (showLabels && hasIntervals) {
      svg += '<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + intervals[i] + '</text>';
    } else if (showLabels && labels && labels[i]) {
      svg += '<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + labels[i] + '</text>';
    } else if (showNumbers && !showLabels) {
      svg += '<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + (i + 1) + '</text>';
    }
  });

  // Interactive tap zones + ghosts (rendered last for z-order)
  if (interactive) {
    for (var s = 1; s <= numStrings; s++) {
      for (var f = 0; f <= numFrets; f++) {
        var cx = f === 0 ? (labelW + nutX) / 2 + 14 : fretStart + fretW * (f - 0.5);
        var cy = stringGap * s;
        svg += '<circle class="tap-zone" cx="' + cx + '" cy="' + cy + '" r="' + (fretW * 0.4) + '" fill="transparent" data-s="' + s + '" data-f="' + f + '"/>';
        svg += '<g class="ghost-group"><circle cx="' + cx + '" cy="' + cy + '" r="6" fill="var(--accent)"/></g>';
      }
    }
  }

  svg += '</svg>';
  return svg;
}

// ─── Main render ───
function render() {
  var type = document.getElementById('card-type').value;
  var showNums = (type === 'scale' || type === 'arpeggio');
  var root = placedDots.length > 0 ? placedDots[rootIdx] || placedDots[0] : null;

  // Fretboard
  document.getElementById('fretboard').innerHTML = renderFretboard({
    dots: placedDots,
    root: root,
    interactive: true,
    showNumbers: showNums
  });

  // Attach tap handlers
  document.querySelectorAll('#fretboard .tap-zone').forEach(function(zone) {
    zone.addEventListener('click', function() {
      var s = +this.getAttribute('data-s');
      var f = +this.getAttribute('data-f');
      onTap(s, f);
    });
  });

  // Dot list
  renderDotList();

  // Computed fields
  updateComputed();

  // Preview
  renderPreview();
}

function onTap(s, f) {
  var idx = -1;
  placedDots.forEach(function(d, i) {
    if (d.s === s && d.f === f) idx = i;
  });

  if (idx >= 0) {
    placedDots.splice(idx, 1);
    if (rootIdx >= placedDots.length) rootIdx = 0;
  } else {
    placedDots.push({ s: s, f: f });
    playNote(s, f);
  }

  render();
}

function renderDotList() {
  var el = document.getElementById('dot-list');
  if (placedDots.length === 0) {
    el.innerHTML = '<span class="dot-placeholder">No dots placed yet</span>';
    return;
  }

  var html = '';
  placedDots.forEach(function(d, i) {
    var note = noteAt(d.s, d.f);
    var isRoot = (i === rootIdx);
    html += '<div class="dot-chip' + (isRoot ? ' is-root' : '') + '" onclick="setRoot(' + i + ')">';
    html += '<span class="chip-num">' + (i + 1) + '</span>';
    html += note + ' (' + d.s + '-' + d.f + ')';
    html += '<span class="chip-x" onclick="event.stopPropagation();removeDot(' + i + ');">&times;</span>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function setRoot(i) {
  rootIdx = i;
  render();
}

function removeDot(i) {
  placedDots.splice(i, 1);
  if (rootIdx >= placedDots.length) rootIdx = Math.max(0, placedDots.length - 1);
  render();
}

function updateComputed() {
  if (placedDots.length === 0) {
    document.getElementById('comp-dots').textContent = '-';
    document.getElementById('comp-notes').textContent = '-';
    document.getElementById('comp-intervals').textContent = '-';
    return;
  }

  var dotsStr = placedDots.map(function(d) { return d.s + '-' + d.f; }).join(',');
  var notes = placedDots.map(function(d) { return noteAt(d.s, d.f); });
  var root = placedDots[rootIdx] || placedDots[0];
  var rootNote = noteAt(root.s, root.f);
  var intervals = notes.map(function(n) { return intervalFromRoot(rootNote, n); });

  document.getElementById('comp-dots').textContent = dotsStr;
  document.getElementById('comp-notes').textContent = notes.join(',');
  document.getElementById('comp-intervals').textContent = intervals.join(',');
}

// ─── Preview ───
function setPreview(mode, btn) {
  previewMode = mode;
  document.querySelectorAll('.preview-tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  renderPreview();
}

function renderPreview() {
  var area = document.getElementById('preview-area');
  var sidesNote = document.getElementById('preview-sides-note');
  var sides = document.getElementById('card-sides').value;

  // Show which sides will be generated
  var sidesMsg = { both: 'Will generate both Recognition and Recall cards', recognition: 'Will generate Recognition card only', recall: 'Will generate Recall card only' };
  sidesNote.textContent = sidesMsg[sides] || '';

  if (placedDots.length === 0) {
    area.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:20px;font-size:13px;">Place dots on the fretboard to see preview</div>';
    return;
  }

  var type = document.getElementById('card-type').value;
  var name = document.getElementById('card-name').value || 'Untitled';
  var root = placedDots[rootIdx] || placedDots[0];
  var rootNote = noteAt(root.s, root.f);
  var notes = placedDots.map(function(d) { return noteAt(d.s, d.f); });
  var intervals = notes.map(function(n) { return intervalFromRoot(rootNote, n); });
  var showNums = (type === 'scale' || type === 'arpeggio');

  var color = noteColors[rootNote] || '#4ba9c8';
  var dark = needsDarkText(color);
  var textCol = dark ? 'rgba(0,0,0,0.7)' : '#fff';
  var subCol = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.5)';
  var key = document.getElementById('card-key').value;
  var shape = document.getElementById('card-shape').value;

  var html = '';

  // Answer section helper
  function answerSection() {
    var a = '<div style="background:' + color + ';border-radius:10px;margin-top:12px;padding:18px;text-align:center;">';
    a += '<div style="font-size:11px;color:' + subCol + ';margin-bottom:4px;">' + type.charAt(0).toUpperCase() + type.slice(1) + '</div>';
    a += '<div style="font-size:36px;font-weight:800;color:' + textCol + ';">' + name + '</div>';
    if (key) a += '<div style="font-size:12px;color:' + subCol + ';margin-top:2px;">Key: ' + key + '</div>';
    if (shape) a += '<div style="font-size:12px;color:' + subCol + ';margin-top:2px;">' + shape + '</div>';
    a += '</div>';
    return a;
  }

  if (previewMode === 'recognition') {
    // Front
    html += '<div style="font-size:10px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Front</div>';
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">What is this?</div>';
    html += renderFretboard({ dots: placedDots, root: root, showNumbers: showNums });

    // Divider
    html += '<hr style="border:none;border-top:1px dashed var(--border-dashed);margin:16px 0;">';

    // Back
    html += '<div style="font-size:10px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Back</div>';
    html += renderFretboard({ dots: placedDots, root: root, intervals: intervals, labels: notes, showLabels: true });
    html += answerSection();

  } else {
    // Recall Front
    html += '<div style="font-size:10px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Front</div>';
    html += '<div style="font-size:22px;font-weight:700;color:var(--text-primary);margin-bottom:8px;">' + name + '</div>';
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">Tap to place the dots</div>';
    html += renderFretboard({ dots: [] });

    // Divider
    html += '<hr style="border:none;border-top:1px dashed var(--border-dashed);margin:16px 0;">';

    // Recall Back
    html += '<div style="font-size:10px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Back</div>';
    html += renderFretboard({ dots: placedDots, root: root, intervals: intervals, labels: notes, showLabels: true });
    html += answerSection();
  }

  area.innerHTML = html;
}

// ─── AnkiConnect ───
function ankiRequest(action, params) {
  return fetch('http://localhost:8765', {
    method: 'POST',
    body: JSON.stringify({ action: action, version: 6, params: params || {} })
  }).then(function(r) { return r.json(); });
}

function checkAnki() {
  var dot = document.getElementById('status-dot');
  var text = document.getElementById('status-text');
  text.textContent = 'Checking...';

  ankiRequest('version').then(function(r) {
    if (r.result) {
      ankiConnected = true;
      dot.classList.add('connected');
      text.textContent = 'Connected (v' + r.result + ')';
      loadDecks();
    } else {
      throw new Error('No version');
    }
  }).catch(function() {
    ankiConnected = false;
    dot.classList.remove('connected');
    text.textContent = 'Not connected — is Anki open with AnkiConnect?';
  });
}

function loadDecks() {
  ankiRequest('deckNames').then(function(r) {
    var sel = document.getElementById('deck-select');
    sel.innerHTML = '';
    (r.result || []).forEach(function(d) {
      var opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      if (d.indexOf('Fretboard') >= 0 || d.indexOf('Guitar') >= 0) opt.selected = true;
      sel.appendChild(opt);
    });
  }).catch(function() {});
}

function sendToAnki() {
  if (placedDots.length === 0) {
    showToast('Place some dots first', 'error');
    return;
  }

  var deck = document.getElementById('deck-select').value;
  if (!deck) {
    showToast('Select a deck', 'error');
    return;
  }

  var type = document.getElementById('card-type').value;
  var name = document.getElementById('card-name').value;
  var key = document.getElementById('card-key').value;
  var shape = document.getElementById('card-shape').value;

  if (!name) {
    showToast('Enter a name', 'error');
    return;
  }

  var root = placedDots[rootIdx] || placedDots[0];
  var rootNote = noteAt(root.s, root.f);
  var dotsStr = placedDots.map(function(d) { return d.s + '-' + d.f; }).join(',');
  var rootStr = root.s + '-' + root.f;
  var notes = placedDots.map(function(d) { return noteAt(d.s, d.f); });
  var intervals = notes.map(function(n) { return intervalFromRoot(rootNote, n); });

  var sides = document.getElementById('card-sides').value;
  var tags = [type.charAt(0).toUpperCase() + type.slice(1)];
  if (key) tags.push(key.replace(/\s/g, '_'));
  if (sides !== 'both') tags.push('sides::' + sides);

  // Map sides to a field value the template can check
  var sidesField = sides === 'recognition' ? 'recognition' : sides === 'recall' ? 'recall' : '';

  ankiRequest('addNote', {
    note: {
      deckName: deck,
      modelName: 'Fretboard',
      fields: {
        Type: type,
        Name: name,
        Dots: dotsStr,
        Root: rootStr,
        Notes: notes.join(','),
        Shape: shape,
        Key: key,
        Intervals: intervals.join(','),
        Sides: sidesField
      },
      tags: tags
    }
  }).then(function(r) {
    if (r.error) {
      showToast('Error: ' + r.error, 'error');
    } else {
      showToast('Card added! (ID: ' + r.result + ')', 'success');
    }
  }).catch(function(e) {
    showToast('Failed to connect: ' + e.message, 'error');
  });
}

// ─── Utils ───
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type + ' show';
  setTimeout(function() { el.classList.remove('show'); }, 3000);
}

function clearAll() {
  placedDots = [];
  rootIdx = 0;
  document.getElementById('card-name').value = '';
  document.getElementById('card-key').value = '';
  document.getElementById('card-shape').value = '';
  render();
}

function onTypeChange() {
  render();
}

function toggleDark() {
  isDark = !isDark;
  document.body.classList.toggle('dark-body', isDark);
}

// ─── Init ───
render();
checkAnki();

// Live preview on input
['card-name', 'card-key', 'card-shape'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', renderPreview);
});
</script>
