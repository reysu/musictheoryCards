<div class="tag">🎼 Sheet Music</div>
<div class="staff-prompt">Place this note on the staff:</div>
<div class="staff-name">{{Name}}</div>
<div id="recall-result-staff"></div>

<div class="answer-section" id="recall-answer" onclick="SM.playCorrect()" style="cursor:pointer;text-align:center;padding:24px;">
  <div id="recall-label" style="font-size:13px;margin-bottom:8px;">Note</div>
  <div class="note-reveal" id="recall-reveal">{{Name}}</div>
  <div id="recall-clef" style="font-size:13px;margin-top:4px;"></div>
  <div id="recall-hint" style="font-size:13px;margin-top:6px;">🔊 tap to play</div>
</div>

<script>
var SM = window.SM || {};
if (!SM.noteToMidi) {
  SM.noteNames = ['C','D','E','F','G','A','B'];
  SM.midiBase = {'C':0,'D':2,'E':4,'F':5,'G':7,'A':9,'B':11};
  SM.noteToMidi = {};
  for (var o=0;o<=8;o++) SM.noteNames.forEach(function(n){SM.noteToMidi[n+o]=12+o*12+SM.midiBase[n];});
}
SM.playNote = SM.playNote || function(noteStr) {
  try {
    var ctx = SM.ctx || (SM.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    var midi = SM.noteToMidi[noteStr] || 60;
    var freq = 440 * Math.pow(2, (midi - 69) / 12);
    var now = ctx.currentTime;
    var g = ctx.createGain(); g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.001, now + 1.5); g.connect(ctx.destination);
    var osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now); osc.connect(g); osc.start(now); osc.stop(now + 1.5);
    var g2 = ctx.createGain(); g2.gain.setValueAtTime(0.08, now); g2.gain.exponentialRampToValueAtTime(0.001, now + 1.0); g2.connect(ctx.destination);
    var osc2 = ctx.createOscillator(); osc2.type = 'triangle'; osc2.frequency.setValueAtTime(freq * 2, now); osc2.connect(g2); osc2.start(now); osc2.stop(now + 1.0);
  } catch(e) {}
};

SM.treblePos = SM.treblePos || {'C4':-2,'D4':-1,'E4':0,'F4':1,'G4':2,'A4':3,'B4':4,'C5':5,'D5':6,'E5':7,'F5':8,'G5':9};
SM.bassPos = SM.bassPos || {'B1':-4,'C2':-3,'D2':-2,'E2':-1,'F2':0,'G2':1,'A2':2,'B2':3,'C3':4,'D3':5,'E3':6,'F3':7,'G3':8,'A3':9,'B3':10,'C4':11,'D4':12};
if (!SM.treblePosToNote) { SM.treblePosToNote = {}; Object.keys(SM.treblePos).forEach(function(k){SM.treblePosToNote[SM.treblePos[k]]=k;}); }
if (!SM.bassPosToNote) { SM.bassPosToNote = {}; Object.keys(SM.bassPos).forEach(function(k){SM.bassPosToNote[SM.bassPos[k]]=k;}); }
SM.posToNote = SM.posToNote || function(pos,clef) { return clef==='treble'?SM.treblePosToNote[pos]:SM.bassPosToNote[pos]; };
SM.getStaffPos = SM.getStaffPos || function(noteStr,clef) { return clef==='treble'?SM.treblePos[noteStr]:SM.bassPos[noteStr]; };

if (!SM.renderStaff) {
  SM.renderStaff = function(opts) {
    opts = opts || {};
    var clef = opts.clef || 'treble', notePos = opts.notePos, showLabel = opts.showLabel || false, noteLabel = opts.noteLabel || '', resultNote = opts.resultNote || null, placedPos = opts.placedPos;
    var w = 400, h = 160, staffTop = 40, lineGap = 16, staffLeft = 70, staffRight = w - 30, noteX = (staffLeft + staffRight) / 2;
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;">';
    for (var i = 0; i < 5; i++) { var y = staffTop + i * lineGap; svg += '<line x1="'+staffLeft+'" y1="'+y+'" x2="'+staffRight+'" y2="'+y+'" stroke="var(--staff-line,var(--text-secondary))" stroke-width="1.2"/>'; }
    if (clef === 'treble') svg += '<text x="'+(staffLeft+4)+'" y="'+(staffTop+lineGap*4+4)+'" font-size="'+(lineGap*5.8)+'" fill="var(--text-primary)" font-family="\'Times New Roman\',serif" opacity="0.65">\uD834\uDD1E</text>';
    else svg += '<text x="'+(staffLeft+4)+'" y="'+(staffTop+lineGap*3)+'" font-size="'+(lineGap*3.8)+'" fill="var(--text-primary)" font-family="\'Times New Roman\',serif" opacity="0.65">\uD834\uDD22</text>';
    function posToY(pos) { return staffTop + 4 * lineGap - pos * (lineGap / 2); }
    function drawLedgers(pos) { var r='',lw=28; if(pos<=-2){for(var p=-2;p>=pos;p-=2){var ly=posToY(p);r+='<line x1="'+(noteX-lw/2)+'" y1="'+ly+'" x2="'+(noteX+lw/2)+'" y2="'+ly+'" stroke="var(--staff-line,var(--text-secondary))" stroke-width="1.2"/>';}} if(pos>=10){for(var p=10;p<=pos;p+=2){var ly=posToY(p);r+='<line x1="'+(noteX-lw/2)+'" y1="'+ly+'" x2="'+(noteX+lw/2)+'" y2="'+ly+'" stroke="var(--staff-line,var(--text-secondary))" stroke-width="1.2"/>';}} return r; }
    function drawNote(pos, fill, label, pulse) { var ny=posToY(pos),r=drawLedgers(pos); r+='<ellipse cx="'+noteX+'" cy="'+ny+'" rx="8" ry="6" fill="'+fill+'" transform="rotate(-15,'+noteX+','+ny+')"/>'; if(pulse){r+='<ellipse cx="'+noteX+'" cy="'+ny+'" rx="8" ry="6" fill="none" stroke="'+fill+'" stroke-width="2" opacity="0.4" transform="rotate(-15,'+noteX+','+ny+')"><animate attributeName="rx" from="8" to="18" dur="2s" repeatCount="indefinite"/><animate attributeName="ry" from="6" to="14" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.4" to="0" dur="2s" repeatCount="indefinite"/></ellipse>';} var stemUp=pos<5; if(stemUp) r+='<line x1="'+(noteX+7.5)+'" y1="'+ny+'" x2="'+(noteX+7.5)+'" y2="'+(ny-35)+'" stroke="'+fill+'" stroke-width="1.5"/>'; else r+='<line x1="'+(noteX-7.5)+'" y1="'+ny+'" x2="'+(noteX-7.5)+'" y2="'+(ny+35)+'" stroke="'+fill+'" stroke-width="1.5"/>'; if(label) r+='<text x="'+noteX+'" y="'+(ny+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">'+label+'</text>'; return r; }
    if (notePos !== undefined && notePos !== null) svg += drawNote(notePos, 'var(--accent)', showLabel ? noteLabel : '', !showLabel);
    if (placedPos !== undefined && placedPos !== null) svg += drawNote(placedPos, 'var(--accent)', '', false);
    if (resultNote) { if(resultNote.correct!==null&&resultNote.correct!==undefined){var cy=posToY(resultNote.correct);svg+=drawLedgers(resultNote.correct);svg+='<ellipse cx="'+noteX+'" cy="'+cy+'" rx="8" ry="6" fill="var(--green)" transform="rotate(-15,'+noteX+','+cy+')"/>';svg+='<text x="'+noteX+'" y="'+(cy+4)+'" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">\u2713</text>';} if(resultNote.wrong!==null&&resultNote.wrong!==undefined){var cy=posToY(resultNote.wrong);svg+='<ellipse cx="'+noteX+'" cy="'+cy+'" rx="8" ry="6" fill="var(--red)" transform="rotate(-15,'+noteX+','+cy+')"/>';svg+='<text x="'+noteX+'" y="'+(cy+4)+'" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">\u2717</text>';} if(resultNote.missing!==null&&resultNote.missing!==undefined){var cy=posToY(resultNote.missing);svg+=drawLedgers(resultNote.missing);svg+='<ellipse cx="'+noteX+'" cy="'+cy+'" rx="8" ry="6" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="4 2" transform="rotate(-15,'+noteX+','+cy+')"/>';} }
    var positions = clef==='treble'?SM.treblePos:SM.bassPos, allPos=Object.values(positions), minP=Math.min.apply(null,allPos), maxP=Math.max.apply(null,allPos);
    for (var p=minP;p<=maxP;p++) { var ty=posToY(p); svg+='<rect class="tap-zone" x="'+staffLeft+'" y="'+(ty-lineGap/4)+'" width="'+(staffRight-staffLeft)+'" height="'+(lineGap/2)+'" fill="transparent" data-pos="'+p+'"/>'; svg+='<ellipse class="ghost-note" cx="'+noteX+'" cy="'+ty+'" rx="8" ry="6" fill="var(--accent)" transform="rotate(-15,'+noteX+','+ty+')"/>'; }
    svg += '</svg>'; return svg;
  };
}

(function() {
  var noteStr = '{{Notes}}';
  var clef = '{{Clef}}';
  var pitchClass = noteStr.replace(/[0-9]/g, '');
  var correctPos = SM.getStaffPos(noteStr, clef);
  var placed = SM.recallPlaced;

  var result = {};
  if (placed !== null && placed !== undefined) {
    if (placed === correctPos) result.correct = correctPos;
    else { result.wrong = placed; result.missing = correctPos; }
  } else {
    result.missing = correctPos;
  }

  var container = document.getElementById('recall-result-staff');
  container.innerHTML = SM.renderStaff({ clef: clef, resultNote: result });

  container.querySelectorAll('.tap-zone').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      var pos = parseInt(el.getAttribute('data-pos'));
      var note = SM.posToNote(pos, clef);
      if (note) SM.playNote(note);
    });
  });

  // Color answer section
  var noteColors = {
    'C':'#DC4040','C#':'#6A1FCC','D':'#E8C820','D#':'#9898A0',
    'E':'#6AADBD','F':'#9B1B1B','F#':'#7B2DB8','G':'#E08030',
    'G#':'#B85EB0','A':'#2E8B57','A#':'#A85A30','B':'#4169E1'
  };
  function needsDarkText(hex) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return (0.299*r + 0.587*g + 0.114*b) > 160;
  }
  var color = noteColors[pitchClass] || '#4ba9c8';
  var dark = needsDarkText(color);
  var section = document.getElementById('recall-answer');
  section.style.background = color;
  document.getElementById('recall-reveal').style.color = dark ? 'rgba(0,0,0,0.7)' : '#fff';
  document.getElementById('recall-label').style.color = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.6)';
  document.getElementById('recall-clef').style.color = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.5)';
  document.getElementById('recall-clef').textContent = clef + ' clef';
  document.getElementById('recall-hint').style.color = dark ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.35)';

  SM._correctNote = noteStr;
})();

SM.playCorrect = function() { SM.playNote(SM._correctNote); };
</script>
