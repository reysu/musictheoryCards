<div class="tag">🎼 Sheet Music</div>
<div class="staff-prompt">What note is this?</div>
<div id="staff-back"></div>

<div class="answer-section" id="answer-area" onclick="SM.playBack()" style="cursor:pointer;text-align:center;padding:24px;">
  <div id="note-label" style="font-size:13px;margin-bottom:8px;">Note</div>
  <div class="note-reveal" id="note-reveal">{{Name}}</div>
  <div id="clef-detail" style="font-size:13px;margin-top:4px;"></div>
  <div id="tap-hint" style="font-size:13px;margin-top:6px;">🔊 tap to play</div>
</div>

<script>
var SM = window.SM || {};
SM.noteNames = SM.noteNames || ['C','D','E','F','G','A','B'];
SM.midiBase = SM.midiBase || {'C':0,'D':2,'E':4,'F':5,'G':7,'A':9,'B':11};
if (!SM.noteToMidi) { SM.noteToMidi = {}; for (var o=0;o<=8;o++) SM.noteNames.forEach(function(n){SM.noteToMidi[n+o]=12+o*12+SM.midiBase[n];}); }
SM.playNote = SM.playNote || function(noteStr) {
  try {
    var ctx = SM.ctx || (SM.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    var midi = SM.noteToMidi[noteStr] || 60;
    var freq = 440 * Math.pow(2, (midi - 69) / 12);
    var now = ctx.currentTime;
    var g = ctx.createGain(); g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.001, now + 1.5); g.connect(ctx.destination);
    var osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now); osc.connect(g); osc.start(now); osc.stop(now + 1.5);
    var g2 = ctx.createGain(); g2.gain.setValueAtTime(0.08, now); g2.gain.exponentialRampToValueAtTime(0.001, now + 1.0); g2.connect(ctx.destination);
    var osc2 = ctx.createOscillator(); osc2.type = 'triangle'; osc2.frequency.setValueAtTime(freq * 2, now); osc2.connect(g2); osc2.start(now); osc2.stop(now + 1.0);
  } catch(e) {}
};

(function() {
  var noteStr = '{{Notes}}';
  var clef = '{{Clef}}';
  var pitchClass = noteStr.replace(/[0-9]/g, '');
  var staffPos = SM.getStaffPos(noteStr, clef);

  var container = document.getElementById('staff-back');
  container.innerHTML = SM.renderStaff({ clef: clef, notePos: staffPos, showLabel: true, noteLabel: pitchClass });

  container.querySelectorAll('.tap-zone').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      var pos = parseInt(el.getAttribute('data-pos'));
      var note = SM.posToNote(pos, clef);
      if (note) SM.playNote(note);
    });
  });

  // Color the answer section
  var noteColors = {
    'C':'#DC4040','C#':'#6A1FCC','D':'#E8C820','D#':'#9898A0',
    'E':'#6AADBD','F':'#9B1B1B','F#':'#7B2DB8','G':'#E08030',
    'G#':'#B85EB0','A':'#2E8B57','A#':'#A85A30','B':'#4169E1'
  };
  function needsDarkText(hex) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return (0.299*r + 0.587*g + 0.114*b) > 160;
  }
  var color = noteColors[pitchClass] || '#4ba9c8';
  var dark = needsDarkText(color);
  var section = document.getElementById('answer-area');
  section.style.background = color;
  document.getElementById('note-reveal').style.color = dark ? 'rgba(0,0,0,0.7)' : '#fff';
  document.getElementById('note-label').style.color = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.6)';
  document.getElementById('clef-detail').style.color = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.5)';
  document.getElementById('clef-detail').textContent = clef + ' clef';
  document.getElementById('tap-hint').style.color = dark ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.35)';

  SM._backNote = noteStr;
})();

SM.playBack = function() { SM.playNote(SM._backNote); };
setTimeout(function() { SM.playBack(); }, 200);
</script>
