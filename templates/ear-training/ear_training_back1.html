{{FrontSide}}

<div id="ear-fretboard-back"></div>

<div class="answer-section" id="ear-answer-area" style="cursor:pointer;text-align:center;padding:24px;">
  <div class="note-label" id="ear-label" style="font-size:13px;margin-bottom:8px;">Interval</div>
  <div class="note-reveal" id="ear-reveal">{{Interval}}</div>
  <div class="note-detail-colored" id="ear-detail"></div>
  <div class="note-detail-colored" id="ear-notes" style="margin-top:4px;"></div>
  <div class="tap-hint" id="ear-hint">tap to replay</div>
</div>

<style>
@keyframes keyPulse {
  0% { transform: scale(0.8); opacity: 0; }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); opacity: 1; }
}

.note-reveal {
  font-size: 56px;
  font-weight: 800;
  color: #fff;
  animation: keyPulse 0.5s ease-out;
}

.note-label {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 8px;
}

.note-detail-colored {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
}

.tap-hint {
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  margin-top: 6px;
}

.answer-section {
  padding: 14px 16px;
  background: var(--bg-subtle);
  border-radius: 10px;
  margin-top: 14px;
  text-align: center;
  cursor: pointer;
  transition: background 0.2s ease;
}

.answer-section:hover { filter: brightness(1.1); }
</style>

<script>
// ─── Audio engine (ensure loaded) ───
var EAR = window.EAR || {};
EAR.tuning = EAR.tuning || [64, 59, 55, 50, 45, 40];
EAR.noteNames = EAR.noteNames || ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
EAR.stringLabels = EAR.stringLabels || ['E','B','G','D','A','E'];

EAR.noteFreq = EAR.noteFreq || function(midi) { return 440 * Math.pow(2, (midi - 69) / 12); };
EAR.midiFromNote = EAR.midiFromNote || function(noteStr) {
  var m = noteStr.match(/^([A-G]#?)(\d+)$/);
  if (!m) return 60;
  return (parseInt(m[2]) + 1) * 12 + EAR.noteNames.indexOf(m[1]);
};

EAR.playGuitarNote = EAR.playGuitarNote || function(midi, startTime) {
  try {
    var ctx = EAR.ctx || (EAR.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    var freq = EAR.noteFreq(midi);
    var now = startTime || ctx.currentTime;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.3, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    g.connect(ctx.destination);
    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    osc.connect(g);
    osc.start(now); osc.stop(now + 1.5);
    var g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.08, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    g2.connect(ctx.destination);
    var osc2 = ctx.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2.002, now);
    osc2.connect(g2);
    osc2.start(now); osc2.stop(now + 1.0);
  } catch(e) {}
};

EAR.playInterval = EAR.playInterval || function() {
  var ctx = EAR.ctx || (EAR.ctx = new (window.AudioContext || window.webkitAudioContext)());
  if (ctx.state === 'suspended') ctx.resume();
  var now = ctx.currentTime;
  EAR.playGuitarNote(EAR.refMidi, now);
  EAR.playGuitarNote(EAR.tgtMidi, now + 0.8);
};

EAR.renderFretboard = EAR.renderFretboard || function() { return ''; };

// ─── Render back ───
(function() {
  var refNote = '{{ReferenceNote}}';
  var tgtNote = '{{TargetNote}}';
  var intervalName = '{{Interval}}';
  var rootStr = parseInt('{{RootString}}');
  var rootFret = parseInt('{{RootFret}}');
  var tgtStr = parseInt('{{TargetString}}');
  var tgtFret = parseInt('{{TargetFret}}');

  EAR.refMidi = EAR.midiFromNote(refNote);
  EAR.tgtMidi = EAR.midiFromNote(tgtNote);

  var refNoteName = refNote.replace(/\d+$/, '');
  var tgtNoteName = tgtNote.replace(/\d+$/, '');

  var intervalColors = {
    'P1':'#4ba9c8','m2':'#9B1B1B','M2':'#7a8a96','m3':'#c87a30','M3':'#e8a030',
    'P4':'#5a8abf','TT':'#9b59b6','P5':'#3a9a5a','m6':'#6A1FCC','M6':'#2E8B57',
    'm7':'#c75050','M7':'#9b59b6','P8':'#4ba9c8'
  };

  var intervalFullNames = {
    'P1':'Unison','m2':'Minor 2nd','M2':'Major 2nd','m3':'Minor 3rd','M3':'Major 3rd',
    'P4':'Perfect 4th','TT':'Tritone','P5':'Perfect 5th','m6':'Minor 6th','M6':'Major 6th',
    'm7':'Minor 7th','M7':'Major 7th','P8':'Octave'
  };

  var ivColor = intervalColors[intervalName] || '#4ba9c8';

  // Render fretboard with both dots
  var container = document.getElementById('ear-fretboard-back');
  container.innerHTML = EAR.renderFretboard({
    refDot: { s: rootStr, f: rootFret },
    tgtDot: { s: tgtStr, f: tgtFret },
    showTarget: true,
    refLabel: refNoteName,
    tgtLabel: tgtNoteName,
    tgtColor: ivColor
  });

  // Tap-to-play on back fretboard
  container.querySelectorAll('.tap-zone').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      var midi = EAR.tuning[parseInt(el.getAttribute('data-s')) - 1] + parseInt(el.getAttribute('data-f'));
      EAR.playGuitarNote(midi);
    });
  });

  // Color the answer section
  function needsDarkText(hex) {
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 160;
  }

  var dark = needsDarkText(ivColor);
  var textCol = dark ? 'rgba(0,0,0,0.7)' : '#fff';
  var subCol = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.5)';
  var hintCol = dark ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.35)';

  var section = document.getElementById('ear-answer-area');
  section.style.background = ivColor;
  document.getElementById('ear-reveal').style.color = textCol;
  document.getElementById('ear-label').style.color = subCol;
  document.getElementById('ear-detail').style.color = subCol;
  document.getElementById('ear-detail').textContent = intervalFullNames[intervalName] || intervalName;
  document.getElementById('ear-notes').style.color = subCol;
  document.getElementById('ear-notes').innerHTML = refNoteName + ' &rarr; ' + tgtNoteName;
  document.getElementById('ear-hint').style.color = hintCol;

  // Replay on tap
  section.onclick = function(e) {
    e.stopPropagation();
    EAR.playInterval();
  };

  // Auto-play on back reveal
  setTimeout(function() { EAR.playInterval(); }, 200);
})();
</script>
