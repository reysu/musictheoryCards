<div class="tag">🎹 Piano</div>
<div class="piano-prompt">Play this note:</div>
<div class="piano-name">{{Name}}</div>
<div class="piano-wrap" id="recall-result-piano"></div>

<div class="answer-section" id="recall-answer" onclick="PK.replayCorrect()" style="cursor:pointer;text-align:center;padding:24px;">
  <div id="recall-label" style="font-size:13px;margin-bottom:8px;">Note</div>
  <div class="note-reveal" id="recall-reveal">{{Name}}</div>
  <div id="recall-hint" style="font-size:13px;margin-top:6px;">🔊 tap to play</div>
</div>

<script>
var PK = window.PK || {};

(function() {
  var keysStr = '{{Keys}}';
  var correctKeys = PK.parseKeys(keysStr);
  var nameStr = '{{Name}}';
  var pitchClass = nameStr.trim().replace(/\d.*/,'').replace(/\s.*/,'');
  var placed = PK.recallPlaced || [];

  var correctSet = {}, placedSet = {};
  correctKeys.forEach(function(k){correctSet[k]=1;});
  placed.forEach(function(k){placedSet[k]=1;});

  var correct = [], wrong = [], missing = [];
  placed.forEach(function(k){ if (correctSet[k]) correct.push(k); else wrong.push(k); });
  correctKeys.forEach(function(k){ if (!placedSet[k]) missing.push(k); });

  var container = document.getElementById('recall-result-piano');
  container.innerHTML = PK.renderPiano({ keys: correctKeys, resultKeys: { correct: correct, wrong: wrong, missing: missing } });

  container.querySelectorAll('.white-key, .black-key').forEach(function(el) {
    el.addEventListener('click', function(e) { e.stopPropagation(); var n = el.getAttribute('data-note'); if (n) PK.playNote(n); });
  });

  var noteColors = {'C':'#DC4040','C#':'#6A1FCC','D':'#E8C820','D#':'#9898A0','E':'#6AADBD','F':'#9B1B1B','F#':'#7B2DB8','G':'#E08030','G#':'#B85EB0','A':'#2E8B57','A#':'#A85A30','B':'#4169E1'};
  function needsDarkText(hex) { var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return (0.299*r+0.587*g+0.114*b)>160; }
  var color = noteColors[pitchClass] || '#4ba9c8';
  var dark = needsDarkText(color);
  document.getElementById('recall-answer').style.background = color;
  document.getElementById('recall-reveal').style.color = dark ? 'rgba(0,0,0,0.7)' : '#fff';
  document.getElementById('recall-label').style.color = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.6)';
  document.getElementById('recall-hint').style.color = dark ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.35)';

  PK._correctKeys = correctKeys;
})();

PK.replayCorrect = function() {
  (PK._correctKeys || []).forEach(function(k, i) { setTimeout(function(){PK.playNote(k);}, i * 150); });
};
</script>
