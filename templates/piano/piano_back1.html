<div class="tag">🎹 Piano</div>
<div class="piano-prompt">What note is this?</div>
<div class="piano-wrap" id="piano-back"></div>

<div class="answer-section" id="answer-area" onclick="PK.replayAll()" style="cursor:pointer;text-align:center;padding:24px;">
  <div id="note-label" style="font-size:13px;margin-bottom:8px;">Note</div>
  <div class="note-reveal" id="note-reveal">{{Name}}</div>
  <div id="tap-hint" style="font-size:13px;margin-top:6px;">🔊 tap to play</div>
</div>

<script>
var PK = window.PK || {};
// Reuse renderer from front1 (Anki loads front first)

(function() {
  var keysStr = '{{Keys}}';
  var keys = PK.parseKeys(keysStr);
  var nameStr = '{{Name}}';
  var pitchClass = nameStr.trim().replace(/\d.*/,'').replace(/\s.*/,'');

  var container = document.getElementById('piano-back');
  container.innerHTML = PK.renderPiano({ keys: keys, showLabel: true });

  container.querySelectorAll('.white-key, .black-key').forEach(function(el) {
    el.addEventListener('click', function(e) { e.stopPropagation(); var n = el.getAttribute('data-note'); if (n) PK.playNote(n); });
  });

  var noteColors = {'C':'#DC4040','C#':'#6A1FCC','D':'#E8C820','D#':'#9898A0','E':'#6AADBD','F':'#9B1B1B','F#':'#7B2DB8','G':'#E08030','G#':'#B85EB0','A':'#2E8B57','A#':'#A85A30','B':'#4169E1'};
  function needsDarkText(hex) { var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return (0.299*r+0.587*g+0.114*b)>160; }
  var color = noteColors[pitchClass] || '#4ba9c8';
  var dark = needsDarkText(color);
  var section = document.getElementById('answer-area');
  section.style.background = color;
  document.getElementById('note-reveal').style.color = dark ? 'rgba(0,0,0,0.7)' : '#fff';
  document.getElementById('note-label').style.color = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.6)';
  document.getElementById('tap-hint').style.color = dark ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.35)';

  PK._backKeys = keys;
})();

PK.replayAll = function() {
  (PK._backKeys || []).forEach(function(k, i) { setTimeout(function(){PK.playNote(k);}, i * 150); });
};
setTimeout(function(){PK.replayAll();}, 200);
</script>
