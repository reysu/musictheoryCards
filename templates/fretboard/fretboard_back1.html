<div class="tag">🎸 Fretboard</div>
<div class="fretboard-prompt">What is this?</div>
<div id="fretboard-back"></div>

<div class="answer-section" id="answer-area" onclick="FB.replayAll()" style="cursor:pointer;text-align:center;padding:24px;">
  <div class="note-label" id="note-label" style="font-size:13px;margin-bottom:8px;">Note</div>
  <div class="note-reveal" id="note-reveal">{{Name}}</div>
  <div class="note-detail-colored" id="dot-detail"></div>
  <div class="shape-info" id="shape-info" style="margin-top:2px;"></div>
  <div class="tap-hint" id="tap-hint">🔊 tap to play</div>
</div>

<script>
// ─── Audio engine (if not loaded from front) ───
var FB = window.FB || {};
FB.tuning = FB.tuning || [64, 59, 55, 50, 45, 40];
FB.noteNames = FB.noteNames || ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
FB.stringLabels = FB.stringLabels || ['E','B','G','D','A','E'];

FB.getMidi = FB.getMidi || function(s, f) { return FB.tuning[s - 1] + f; };
FB.getFreq = FB.getFreq || function(midi) { return 440 * Math.pow(2, (midi - 69) / 12); };

FB.playNote = FB.playNote || function(string, fret) {
  try {
    var ctx = FB.ctx || (FB.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    var midi = FB.getMidi(string, fret);
    var freq = FB.getFreq(midi);
    var now = ctx.currentTime;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.3, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    g.connect(ctx.destination);
    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    osc.connect(g);
    osc.start(now);
    osc.stop(now + 1.5);
    var g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.08, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    g2.connect(ctx.destination);
    var osc2 = ctx.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2, now);
    osc2.connect(g2);
    osc2.start(now);
    osc2.stop(now + 1.0);
  } catch(e) {}
};

FB.parseDots = FB.parseDots || function(str) {
  if (!str) return [];
  return str.split(',').map(function(p) {
    var parts = p.trim().split('-');
    return { s: parseInt(parts[0]), f: parseInt(parts[1]) };
  });
};

// ─── Render back (Recognition) ───
(function() {
  var dotsStr = '{{Dots}}';
  var rootStr = '{{Root}}';
  var notesStr = '{{Notes}}';
  var shapeStr = '{{Shape}}';
  var typeStr = '{{Type}}';

  var dots = FB.parseDots(dotsStr);
  var root = rootStr ? FB.parseDots(rootStr)[0] : null;
  var labels = notesStr ? notesStr.split(',').map(function(n) { return n.trim(); }) : null;

  var container = document.getElementById('fretboard-back');
  container.innerHTML = FB.renderFretboard(dots, { root: root, labels: labels, showLabels: true, svgId: 'fb-back' });

  // Detail line
  var detail = document.getElementById('dot-detail');
  if (dots.length === 1) {
    detail.textContent = 'String ' + dots[0].s + ' · Fret ' + dots[0].f;
  } else {
    detail.textContent = dots.length + ' notes';
  }

  // Shape info
  var shapeEl = document.getElementById('shape-info');
  if (shapeStr) shapeEl.textContent = shapeStr;

  // Store dots for replay
  FB._backDots = dots;

  // Tap any position to hear that note
  FB.onTap = function(s, f) {
    FB.playNote(s, f);
  };

  // Color the answer section by note
  var noteColors = {
    'C':'#DC4040', 'C#':'#6A1FCC', 'D':'#E8C820', 'D#':'#9898A0',
    'E':'#6AADBD', 'F':'#9B1B1B', 'F#':'#7B2DB8', 'G':'#E08030',
    'G#':'#B85EB0', 'A':'#2E8B57', 'A#':'#A85A30', 'B':'#4169E1'
  };
  function needsDarkText(hex) {
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 160;
  }
  var nameStr = '{{Name}}';
  // Extract note name (e.g. "F#" from "F# on String 1")
  var noteName = nameStr.trim().split(' ')[0];
  var color = noteColors[noteName] || '#4ba9c8';
  var dark = needsDarkText(color);
  var section = document.getElementById('answer-area');
  section.style.background = color;
  document.getElementById('note-reveal').style.color = dark ? 'rgba(0,0,0,0.7)' : '#fff';
  document.getElementById('note-label').style.color = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.6)';
  document.getElementById('dot-detail').style.color = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.5)';
  var shapeInfoEl = document.getElementById('shape-info');
  if (shapeInfoEl) shapeInfoEl.style.color = dark ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.4)';
  document.getElementById('tap-hint').style.color = dark ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.35)';
})();

FB.replayAll = function() {
  var dots = FB._backDots || [];
  dots.forEach(function(d, i) {
    setTimeout(function() { FB.playNote(d.s, d.f); }, i * 150);
  });
};

// Auto-play first note on back reveal
setTimeout(function() { FB.replayAll(); }, 200);
</script>
