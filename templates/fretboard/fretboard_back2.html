<div class="tag">🎸 Fretboard</div>
<div class="fretboard-prompt">Place the notes on the fretboard:</div>
<div class="fretboard-name">{{Name}}</div>
<div class="recall-grid-wrap" id="recall-result-fb"></div>

<div class="answer-section" id="recall-answer" onclick="FB.replayCorrect()" style="cursor:pointer;text-align:center;padding:24px;">
  <div id="recall-result-header"></div>
  <div id="recall-notes-info" style="margin-top:4px;"></div>
  <div id="recall-shape-info" style="margin-top:2px;"></div>
  <div id="recall-tap-hint" style="font-size:13px;margin-top:6px;">🔊 tap to play</div>
</div>

<script>
// ─── Audio engine (fallbacks if front didn't load) ───
var FB = window.FB || {};
FB.tuning = FB.tuning || [64, 59, 55, 50, 45, 40];
FB.noteNames = FB.noteNames || ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
FB.stringLabels = FB.stringLabels || ['E','B','G','D','A','E'];

FB.noteColors = FB.noteColors || {
  'C':'#DC4040','C#':'#6A1FCC','D':'#E8C820','D#':'#9898A0',
  'E':'#6AADBD','F':'#9B1B1B','F#':'#7B2DB8','G':'#E08030',
  'G#':'#B85EB0','A':'#2E8B57','A#':'#A85A30','B':'#4169E1'
};

FB.getMidi = FB.getMidi || function(s, f) { return FB.tuning[s - 1] + f; };
FB.getFreq = FB.getFreq || function(midi) { return 440 * Math.pow(2, (midi - 69) / 12); };

FB.playNote = FB.playNote || function(string, fret) {
  try {
    var ctx = FB.ctx || (FB.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    var midi = FB.getMidi(string, fret);
    var freq = FB.getFreq(midi);
    var now = ctx.currentTime;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.3, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    g.connect(ctx.destination);
    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    osc.connect(g);
    osc.start(now);
    osc.stop(now + 1.5);
    var g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.08, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    g2.connect(ctx.destination);
    var osc2 = ctx.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2, now);
    osc2.connect(g2);
    osc2.start(now);
    osc2.stop(now + 1.0);
  } catch(e) {}
};

FB.parseDots = FB.parseDots || function(str) {
  if (!str) return [];
  return str.trim().split(/[\s,]+/).filter(function(p) { return p.indexOf('-') >= 0; }).map(function(p) {
    var parts = p.split('-');
    return { s: parseInt(parts[0]), f: parseInt(parts[1]) };
  });
};

// ─── Fretboard renderer (fallback if front didn't define it) ───
if (!FB.renderFretboard) {
  FB.renderFretboard = function(dots, opts) {
    opts = opts || {};
    var interactive = opts.interactive || false;
    var svgId = opts.svgId || 'fb';
    var resultDots = opts.resultDots || null;

    var numFrets = 12, numStrings = 6;
    var padL = 28, padR = 8, padT = 12, padB = 22;
    var strGap = 20, fretW = 38, nutW = 4;
    var fbW = numFrets * fretW, fbH = (numStrings - 1) * strGap;
    var w = padL + nutW + fbW + padR, h = padT + fbH + padB;

    var svg = '<svg id="' + svgId + '" viewBox="0 0 ' + w + ' ' + h + '">';
    svg += '<rect x="' + padL + '" y="' + padT + '" width="' + nutW + '" height="' + fbH + '" fill="var(--text-primary)" opacity="0.5" rx="1"/>';

    for (var f = 1; f <= numFrets; f++) {
      var x = padL + nutW + f * fretW;
      svg += '<line x1="' + x + '" y1="' + padT + '" x2="' + x + '" y2="' + (padT + fbH) + '" stroke="var(--fret-wire)" stroke-width="1.5"/>';
    }

    [3,5,7,9].forEach(function(f) {
      var mx = padL + nutW + (f - 0.5) * fretW;
      svg += '<circle cx="' + mx + '" cy="' + (padT + fbH / 2) + '" r="4" fill="var(--text-secondary)" opacity="0.12"/>';
    });
    var mx12 = padL + nutW + 11.5 * fretW;
    svg += '<circle cx="' + mx12 + '" cy="' + (padT + strGap * 1.5) + '" r="4" fill="var(--text-secondary)" opacity="0.12"/>';
    svg += '<circle cx="' + mx12 + '" cy="' + (padT + strGap * 3.5) + '" r="4" fill="var(--text-secondary)" opacity="0.12"/>';

    for (var s = 0; s < numStrings; s++) {
      var y = padT + s * strGap;
      svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + nutW + fbW) + '" y2="' + y + '" stroke="var(--string-color)" stroke-width="' + (1 + s * 0.25) + '"/>';
      svg += '<text x="' + (padL - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" font-weight="600" fill="var(--text-secondary)" font-family="Nunito,sans-serif">' + FB.stringLabels[s] + '</text>';
    }

    for (var f = 1; f <= numFrets; f++) {
      var fx = padL + nutW + (f - 0.5) * fretW;
      svg += '<text x="' + fx + '" y="' + (padT + fbH + 15) + '" text-anchor="middle" font-size="8" fill="var(--text-secondary)" opacity="0.4" font-family="Nunito,sans-serif">' + f + '</text>';
    }

    function dotColor(s, f) {
      var midi = FB.getMidi(s, f);
      return FB.noteColors[FB.noteNames[midi % 12]] || 'var(--accent)';
    }
    function dotLabel(s, f) {
      return FB.noteNames[FB.getMidi(s, f) % 12];
    }

    var showColors = opts.showColors || false;
    dots.forEach(function(d) {
      var y = padT + (d.s - 1) * strGap;
      var color = showColors ? dotColor(d.s, d.f) : 'var(--accent)';
      var label = showColors ? dotLabel(d.s, d.f) : '';
      if (d.f === 0) {
        var ox = padL - 14;
        svg += '<circle cx="' + ox + '" cy="' + y + '" r="7" fill="' + color + '"/>';
        if (label) svg += '<text x="' + ox + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + label + '</text>';
      } else {
        var x = padL + nutW + (d.f - 0.5) * fretW;
        svg += '<circle class="placed-dot" cx="' + x + '" cy="' + y + '" r="9" fill="' + color + '"/>';
        if (label) svg += '<text class="placed-dot" x="' + x + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + label + '</text>';
      }
    });

    if (resultDots) {
      if (resultDots.wrong) resultDots.wrong.forEach(function(d) {
        var y = padT + (d.s - 1) * strGap;
        var x = d.f === 0 ? padL - 14 : padL + nutW + (d.f - 0.5) * fretW;
        var r = d.f === 0 ? 7 : 9;
        var color = dotColor(d.s, d.f);
        svg += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '"/>';
        svg += '<text x="' + x + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + dotLabel(d.s, d.f) + '</text>';
        svg += '<circle cx="' + x + '" cy="' + y + '" r="' + (r + 3) + '" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="4 2"/>';
      });
      var answer = (resultDots.correct || []).concat(resultDots.missing || []);
      answer.forEach(function(d) {
        var y = padT + (d.s - 1) * strGap;
        var x = d.f === 0 ? padL - 14 : padL + nutW + (d.f - 0.5) * fretW;
        var r = d.f === 0 ? 7 : 9;
        var color = dotColor(d.s, d.f);
        svg += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '"/>';
        svg += '<text x="' + x + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + dotLabel(d.s, d.f) + '</text>';
      });
    }

    if (interactive) {
      for (var si = 1; si <= numStrings; si++) {
        for (var fi = 0; fi <= numFrets; fi++) {
          var ty = padT + (si - 1) * strGap;
          var tx = fi === 0 ? 0 : padL + nutW + (fi - 1) * fretW;
          var tw = fi === 0 ? padL + nutW : fretW;
          svg += '<rect class="tap-zone" x="' + tx + '" y="' + (ty - strGap / 2) + '" width="' + tw + '" height="' + strGap + '" fill="transparent" data-s="' + si + '" data-f="' + fi + '"/>';
        }
      }
    }

    svg += '</svg>';
    if (interactive) {
      svg += '<div class="recall-actions">';
      svg += '<button class="recall-action-btn" onclick="FB.recallUndo()">\u21a9 Undo</button>';
      svg += '<button class="recall-action-btn" onclick="FB.recallClear()">Clear</button>';
      svg += '</div>';
    }
    return svg;
  };
}

// ─── Compare placed vs correct ───
(function() {
  var dotsStr = '{{Dots}}';
  var notesStr = '{{Notes}}';
  var shapeStr = '{{Shape}}';

  var correctDots = FB.parseDots(dotsStr);
  var placed = FB.placed || [];

  function dotKey(d) { return d.s + '-' + d.f; }

  var correctSet = {};
  correctDots.forEach(function(d) { correctSet[dotKey(d)] = true; });

  var placedSet = {};
  placed.forEach(function(d) { placedSet[dotKey(d)] = true; });

  var correct = [], wrong = [], missing = [];

  placed.forEach(function(d) {
    if (correctSet[dotKey(d)]) correct.push(d);
    else wrong.push(d);
  });

  correctDots.forEach(function(d) {
    if (!placedSet[dotKey(d)]) missing.push(d);
  });

  var container = document.getElementById('recall-result-fb');
  if (container) {
    container.innerHTML = FB.renderFretboard([], {
      svgId: 'fb-result',
      resultDots: { correct: correct, wrong: wrong, missing: missing }
    });
  }

  // ─── Color the answer section with Scriabin note color ───
  var noteColors = FB.noteColors;
  function needsDarkText(hex) {
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 160;
  }

  // Extract root note for color, show full name in reveal
  var nameStr = '{{Name}}';
  var keyStr = '{{Key}}';
  var noteMatch = nameStr.match(/^([A-G][#b]?)/);
  var rootNote = noteMatch ? noteMatch[1] : '';
  var keyMatch = keyStr ? keyStr.match(/^([A-G][#b]?)/) : null;
  var colorRoot = (keyMatch ? keyMatch[1] : rootNote) || '';
  var color = noteColors[colorRoot] || '#4ba9c8';
  var dark = needsDarkText(color);
  var textCol = dark ? 'rgba(0,0,0,0.7)' : '#fff';
  var subCol = dark ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.5)';
  var hintCol = dark ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.35)';

  var displayName = keyStr || rootNote || nameStr.trim();

  var section = document.getElementById('recall-answer');
  if (section) section.style.background = color;

  var headerEl = document.getElementById('recall-result-header');
  if (headerEl) {
    headerEl.innerHTML = '<div class="note-label" style="color:' + subCol + ';">Answer</div>'
      + '<div class="note-reveal" style="color:' + textCol + ';">' + displayName + '</div>';
  }

  var notesEl = document.getElementById('recall-notes-info');
  if (notesEl && notesStr) {
    var labels = notesStr.split(',').map(function(n) { return n.trim(); });
    notesEl.textContent = 'Notes: ' + labels.join(' \u00b7 ');
    notesEl.style.color = subCol;
    notesEl.style.fontSize = '13px';
  }

  var shapeEl = document.getElementById('recall-shape-info');
  if (shapeEl && shapeStr) {
    shapeEl.textContent = shapeStr;
    shapeEl.style.color = subCol;
    shapeEl.style.fontSize = '13px';
  }

  var hintEl = document.getElementById('recall-tap-hint');
  if (hintEl) hintEl.style.color = hintCol;

  FB._correctDots = correctDots;
})();

FB.replayCorrect = function() {
  var dots = FB._correctDots || [];
  dots.forEach(function(d, i) {
    setTimeout(function() { FB.playNote(d.s, d.f); }, i * 150);
  });
};
</script>
