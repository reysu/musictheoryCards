<script>
// Stop any lingering audio from previous card
if (window._audioCtx) { window._audioCtx.close(); window._audioCtx = null; }
</script>
<div class="tag">🎸 Fretboard</div>
<div class="fretboard-prompt">Place the notes on the fretboard:</div>
<div class="fretboard-name">{{Name}}</div>
<div class="recall-grid-wrap" id="recall-grid"></div>

<script>
// ─── Audio engine ───
var FB = window.FB || {};
FB.tuning = [64, 59, 55, 50, 45, 40];
FB.noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
FB.stringLabels = ['E','B','G','D','A','E'];

// Scriabin note colors
FB.noteColors = {
  'C':'#DC4040','C#':'#6A1FCC','D':'#E8C820','D#':'#9898A0',
  'E':'#6AADBD','F':'#9B1B1B','F#':'#7B2DB8','G':'#E08030',
  'G#':'#B85EB0','A':'#2E8B57','A#':'#A85A30','B':'#4169E1'
};

FB.getMidi = function(s, f) { return FB.tuning[s - 1] + f; };
FB.getFreq = function(midi) { return 440 * Math.pow(2, (midi - 69) / 12); };

FB.playNote = function(string, fret) {
  try {
    var ctx = FB.ctx || (FB.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    var midi = FB.getMidi(string, fret);
    var freq = FB.getFreq(midi);
    var now = ctx.currentTime;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.3, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    g.connect(ctx.destination);
    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    osc.connect(g);
    osc.start(now);
    osc.stop(now + 1.5);
    var g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.08, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    g2.connect(ctx.destination);
    var osc2 = ctx.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2, now);
    osc2.connect(g2);
    osc2.start(now);
    osc2.stop(now + 1.0);
  } catch(e) {}
};

FB.parseDots = function(str) {
  if (!str) return [];
  return str.trim().split(/[\s,]+/).filter(function(p) { return p.indexOf('-') >= 0; }).map(function(p) {
    var parts = p.split('-');
    return { s: parseInt(parts[0]), f: parseInt(parts[1]) };
  });
};

// ─── Fretboard SVG renderer ───
FB.renderFretboard = function(dots, opts) {
  opts = opts || {};
  var interactive = opts.interactive || false;
  var svgId = opts.svgId || 'fb';
  var resultDots = opts.resultDots || null;

  var numFrets = 12;
  var numStrings = 6;
  var padL = 28, padR = 8, padT = 12, padB = 22;
  var strGap = 20, fretW = 38, nutW = 4;
  var fbW = numFrets * fretW;
  var fbH = (numStrings - 1) * strGap;
  var w = padL + nutW + fbW + padR;
  var h = padT + fbH + padB;

  var svg = '<svg id="' + svgId + '" viewBox="0 0 ' + w + ' ' + h + '">';

  // Nut
  svg += '<rect x="' + padL + '" y="' + padT + '" width="' + nutW + '" height="' + fbH + '" fill="var(--text-primary)" opacity="0.5" rx="1"/>';

  // Fret wires
  for (var f = 1; f <= numFrets; f++) {
    var x = padL + nutW + f * fretW;
    svg += '<line x1="' + x + '" y1="' + padT + '" x2="' + x + '" y2="' + (padT + fbH) + '" stroke="var(--fret-wire)" stroke-width="1.5"/>';
  }

  // Fret position markers (3, 5, 7, 9 = single dot; 12 = double)
  var markers = [3, 5, 7, 9];
  markers.forEach(function(f) {
    var mx = padL + nutW + (f - 0.5) * fretW;
    var my = padT + fbH / 2;
    svg += '<circle cx="' + mx + '" cy="' + my + '" r="4" fill="var(--text-secondary)" opacity="0.12"/>';
  });
  var mx12 = padL + nutW + 11.5 * fretW;
  svg += '<circle cx="' + mx12 + '" cy="' + (padT + strGap * 1.5) + '" r="4" fill="var(--text-secondary)" opacity="0.12"/>';
  svg += '<circle cx="' + mx12 + '" cy="' + (padT + strGap * 3.5) + '" r="4" fill="var(--text-secondary)" opacity="0.12"/>';

  // Strings
  for (var s = 0; s < numStrings; s++) {
    var y = padT + s * strGap;
    var thick = 1 + s * 0.25;
    svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + nutW + fbW) + '" y2="' + y + '" stroke="var(--string-color)" stroke-width="' + thick + '"/>';
    svg += '<text x="' + (padL - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" font-weight="600" fill="var(--text-secondary)" font-family="Nunito,sans-serif">' + FB.stringLabels[s] + '</text>';
  }

  // Fret numbers
  for (var f = 1; f <= numFrets; f++) {
    var fx = padL + nutW + (f - 0.5) * fretW;
    svg += '<text x="' + fx + '" y="' + (padT + fbH + 15) + '" text-anchor="middle" font-size="8" fill="var(--text-secondary)" opacity="0.4" font-family="Nunito,sans-serif">' + f + '</text>';
  }

  // Helper: get note color for a string/fret position
  function dotColor(s, f) {
    var midi = FB.getMidi(s, f);
    var name = FB.noteNames[midi % 12];
    return FB.noteColors[name] || 'var(--accent)';
  }

  function dotLabel(s, f) {
    var midi = FB.getMidi(s, f);
    return FB.noteNames[midi % 12];
  }

  // Draw placed dots (neutral on front, colored on back via showColors flag)
  var showColors = opts.showColors || false;
  dots.forEach(function(d) {
    var y = padT + (d.s - 1) * strGap;
    var color = showColors ? dotColor(d.s, d.f) : 'var(--accent)';
    var label = showColors ? dotLabel(d.s, d.f) : '';
    if (d.f === 0) {
      var ox = padL - 14;
      svg += '<circle cx="' + ox + '" cy="' + y + '" r="7" fill="' + color + '"/>';
      if (label) svg += '<text x="' + ox + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + label + '</text>';
    } else {
      var x = padL + nutW + (d.f - 0.5) * fretW;
      svg += '<circle class="placed-dot" cx="' + x + '" cy="' + y + '" r="9" fill="' + color + '"/>';
      if (label) svg += '<text class="placed-dot" x="' + x + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + label + '</text>';
    }
  });

  // Result overlay (back side)
  // Correct & missing: show answer with Scriabin colors
  // Wrong: dotted red circle (user placed here incorrectly)
  if (resultDots) {
    if (resultDots.wrong) resultDots.wrong.forEach(function(d) {
      var y = padT + (d.s - 1) * strGap;
      var x = d.f === 0 ? padL - 14 : padL + nutW + (d.f - 0.5) * fretW;
      var r = d.f === 0 ? 7 : 9;
      var color = dotColor(d.s, d.f);
      svg += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '"/>';
      svg += '<text x="' + x + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + dotLabel(d.s, d.f) + '</text>';
      svg += '<circle cx="' + x + '" cy="' + y + '" r="' + (r + 3) + '" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="4 2"/>';
    });
    var answer = (resultDots.correct || []).concat(resultDots.missing || []);
    answer.forEach(function(d) {
      var y = padT + (d.s - 1) * strGap;
      var x = d.f === 0 ? padL - 14 : padL + nutW + (d.f - 0.5) * fretW;
      var r = d.f === 0 ? 7 : 9;
      var color = dotColor(d.s, d.f);
      svg += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '"/>';
      svg += '<text x="' + x + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="Nunito,sans-serif">' + dotLabel(d.s, d.f) + '</text>';
    });
  }

  // Interactive tap zones
  if (interactive) {
    for (var si = 1; si <= numStrings; si++) {
      for (var fi = 0; fi <= numFrets; fi++) {
        var ty = padT + (si - 1) * strGap;
        var tx, tw;
        if (fi === 0) {
          tx = 0;
          tw = padL + nutW;
        } else {
          tx = padL + nutW + (fi - 1) * fretW;
          tw = fretW;
        }
        svg += '<rect class="tap-zone" x="' + tx + '" y="' + (ty - strGap / 2) + '" width="' + tw + '" height="' + strGap + '" fill="transparent" data-s="' + si + '" data-f="' + fi + '"/>';
      }
    }
  }

  svg += '</svg>';

  if (interactive) {
    svg += '<div class="recall-actions">';
    svg += '<button class="recall-action-btn" onclick="FB.recallUndo()">\u21a9 Undo</button>';
    svg += '<button class="recall-action-btn" onclick="FB.recallClear()">Clear</button>';
    svg += '</div>';
  }

  return svg;
};

// ─── Recall state ───
FB.placed = [];

FB.onTap = function(s, f) {
  var idx = -1;
  FB.placed.forEach(function(d, i) {
    if (d.s === s && d.f === f) idx = i;
  });
  if (idx >= 0) {
    FB.placed.splice(idx, 1);
  } else {
    FB.placed.push({ s: s, f: f });
    FB.playNote(s, f);
  }
  FB.renderRecall();
};

FB.recallUndo = function() {
  FB.placed.pop();
  FB.renderRecall();
};

FB.recallClear = function() {
  FB.placed = [];
  FB.renderRecall();
};

FB.renderRecall = function() {
  var container = document.getElementById('recall-grid');
  if (!container) return;
  container.innerHTML = FB.renderFretboard(FB.placed, { interactive: true, svgId: 'fb-recall' });
  // Bind tap zones via event delegation
  var svg = document.getElementById('fb-recall');
  if (svg) {
    svg.querySelectorAll('.tap-zone').forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        FB.onTap(parseInt(el.getAttribute('data-s')), parseInt(el.getAttribute('data-f')));
      });
    });
  }
};

FB.getPlacedStr = function() {
  return FB.placed.map(function(d) { return d.s + '-' + d.f; }).join(',');
};

// Initial render (with DOM-ready guard)
(function init() {
  if (!document.getElementById('recall-grid')) { setTimeout(init, 50); return; }
  FB.renderRecall();
})();
</script>
